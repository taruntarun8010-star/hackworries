<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazar Vendor Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Sora', 'sans-serif'],
                        body: ['Manrope', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c'
                        },
                        skyglow: '#38bdf8'
                    },
                    keyframes: {
                        floaty: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' }
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '0.45' },
                            '50%': { opacity: '0.9' }
                        }
                    },
                    animation: {
                        floaty: 'floaty 5s ease-in-out infinite',
                        pulseSoft: 'pulseSoft 4s ease-in-out infinite'
                    }
                }
            }
        };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        // Apply saved theme before React mounts to avoid flash.
        (function () {
            var savedTheme = localStorage.getItem('bazar_react_theme') || 'dark';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</head>
<body>
    <div id="root" style="min-height: 100vh;"></div>

    <script src="vendorsDummyData.js"></script>
    <script src="companiesDummyData.js"></script>
    <script type="text/babel" src="app.jsx"></script>
    <script>
        // Fallback: ensure page shows content even if React fails to load
        window.addEventListener('error', function(e) {
            console.error('Page Error:', e);
            if (document.getElementById('root').innerHTML === '') {
                document.getElementById('root').innerHTML = '<div style="padding:20px;color:#f8fafc;">Loading... If this persists, check browser console (F12) for errors.</div>';
            }
        });
    </script>
</body>
</html>
